# Em cada PR: roda os testes e, se passarem, gera o APK assinado com a chave do
# app e o publica no pré-release "teste", sempre no mesmo endereço:
#   https://github.com/fabiolimath/PontoIfes/releases/download/teste/ponto-ifes.apk
# É o mesmo APK do release (mesmo pacote e chave): instala por cima do app.
# O pré-release não conta como "latest": o site e o aviso de atualização do app
# continuam apontando para o último release oficial.
name: PR

on:
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

# Um push novo no mesmo PR cancela a rodada anterior.
concurrency:
  group: pr-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  testes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Rodar os testes
        run: ./gradlew --no-daemon test

      # O release sai sozinho no merge só se a versão aumentar (release.yml).
      - name: Conferir se a versão aumentou
        if: github.event_name == 'pull_request'
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          git fetch -q --depth=1 origin "$BASE"
          # A versão fica em app/build.gradle.kts (antes, no pyproject.toml).
          versao_em() {
            if git cat-file -e "$1:app/build.gradle.kts" 2>/dev/null; then
              git show "$1:app/build.gradle.kts" | sed -n 's/^val versao = "\(.*\)"/\1/p' | head -1
            else
              git show "$1:pyproject.toml" | sed -n 's/^version = "\(.*\)"/\1/p' | head -1
            fi
          }
          antes=$(versao_em "$BASE")
          depois=$(versao_em HEAD)
          if git diff --quiet "$BASE" HEAD -- app sigrh gradle build.gradle.kts \
              settings.gradle.kts gradle.properties src android pyproject.toml; then
            echo "O app não mudou; o merge não gera release."
          elif [ "$antes" = "$depois" ]; then
            echo "::error::O app mudou, mas a versão continua $depois. Aumente val versao em app/build.gradle.kts."
            exit 1
          else
            echo "Versão $antes -> $depois: o merge publica o release v$depois."
          fi

  apk:
    needs: testes
    # PRs vindos de forks não recebem os segredos da chave.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    # Um só pré-release "teste": dois PRs não o publicam ao mesmo tempo.
    concurrency:
      group: apk-teste
    env:
      COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.COMMIT }}

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Preparar a chave
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/ponto-release.jks"

      - name: Gerar e assinar o APK de teste
        env:
          PONTO_KEYSTORE: ${{ runner.temp }}/ponto-release.jks
          PONTO_KEYSTORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          ./gradlew --no-daemon assembleRelease
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk dist/ponto-ifes.apk
          "$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)/apksigner" \
            verify --print-certs dist/ponto-ifes.apk | grep -i 'SHA-256'
          ls -l dist/ponto-ifes.apk

      - name: Publicar no pré-release "teste"
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          TITULO_PR: ${{ github.event.pull_request.title }}
          RAMO: ${{ github.event.pull_request.head.ref || github.ref_name }}
        run: |
          versao=$(sed -n 's/^val versao = "\(.*\)"/\1/p' app/build.gradle.kts | head -1)
          origem="${PR:+PR #$PR: $TITULO_PR}"
          origem="${origem:-branch $RAMO}"
          gh release delete teste --cleanup-tag --yes || true
          gh release create teste dist/ponto-ifes.apk --prerelease --target "$COMMIT" \
            --title "Teste ${versao} (${origem})" \
            --notes "APK de teste de ${origem}, commit ${COMMIT::7}. Não é uma versão oficial. Instala por cima do app."
          url="https://github.com/${GITHUB_REPOSITORY}/releases/download/teste/ponto-ifes.apk"
          echo "APK de teste (${origem}): $url" >> "$GITHUB_STEP_SUMMARY"
