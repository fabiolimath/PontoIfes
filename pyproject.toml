[tool.briefcase]
project_name = "Ponto"
bundle = "io.github.fabiolimath"
version = "1.0.5"
url = "https://github.com/fabiolimath/PontoIfes"
license = "LicenseRef-Proprietary"
license-files = ["LICENSE"]
author = "Fabio Lima"
author_email = "fabiolimath@users.noreply.github.com"

[tool.briefcase.app.ponto]
formal_name = "Ponto IFES"
description = "Abre e fecha o ponto e registra o PIT no SIGRH do IFES."
long_description = """Empacota os scripts abrir_ponto.py, fechar_ponto.py e
registrar_pit.py num app Android, com credenciais e log de execuções.
"""
icon = "icons/ponto"
splash_background_color = "#FFFFFF"
sources = [
    "src/ponto",
]
test_sources = [
    "tests",
]

requires = [
    "requests",
    "beautifulsoup4",
]
test_requires = [
    "pytest",
]

# Para testar no PC com `briefcase dev` (Kubuntu).
[tool.briefcase.app.ponto.linux]
requires = [
    "toga-gtk~=0.5.0",
]

[tool.briefcase.app.ponto.linux.system.debian]
system_requires = [
    "libcairo2-dev",
    "libgirepository-2.0-dev",
]
system_runtime_requires = [
    "gir1.2-gtk-3.0",
    "libgirepository-2.0-0",
    "libcanberra-gtk3-module",
]

[tool.briefcase.app.ponto.android]
requires = [
    "toga-android~=0.5.0",
]

base_theme = "Theme.MaterialComponents.Light.DarkActionBar"

build_gradle_dependencies = [
    "com.google.android.material:material:1.13.0",
]

# Atalhos estáticos (android/res/xml/shortcuts.xml): aparecem ao segurar o
# ícone, no Tasker e nas Rotinas. Os recursos em android/res entram no APK.
android_manifest_activity_extra_content = """
            <meta-data android:name="android.app.shortcuts" android:resource="@xml/shortcuts" />
"""
build_gradle_extra_content = """
android {
    sourceSets {
        main {
            res.srcDir(new File(rootProject.projectDir, "../../../../android/res"))
        }
    }
}
"""
